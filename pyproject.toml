[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mojolibrosa"
version = "0.1.0"
description = "Mojo-accelerated audio analysis kernels with a librosa-compatible API"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy"]

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
